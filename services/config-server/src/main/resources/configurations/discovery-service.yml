eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false # Não é preciso registrar o config server no eureka
    fetchRegistry: false # Não é preciso buscar registros no eureka
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

server:
    port: 8761 # this is the default eureka service port